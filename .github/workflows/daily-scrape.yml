# GitHub Actions - Run scraper dans le cloud
# PC peut être éteint, GitHub exécute le code automatiquement
#
# Features:
# - Multi-site scraping (JeMePropose + AlloVoisins)
# - Intelligent quota management (1500 LLM calls/day max)
# - Incremental scraping (only analyze NEW jobs)
# - Automatic quota redistribution between sites

name: Daily Job Scraper

on:
  schedule:
    - cron: '0 6 * * *'  # 7h Paris hiver (UTC+1)
    - cron: '0 5 * * *'  # 7h Paris été (UTC+2)
  workflow_dispatch:

concurrency:
  group: daily-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Restore cache folder
        uses: actions/cache@v4
        with:
          path: cache/
          key: job-cache-v1
          restore-keys: |
            job-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run multi-site scraper with intelligent quota
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scheduled_scraper_v3.py --sites jemepropose allovoisins --verbose

      - name: Commit and push results
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add exports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update: $(date +'%Y-%m-%d %H:%M')" && git push)

# ⚙️ Configuration requise :
# 1. GitHub → Settings → Secrets and variables → Actions
# 2. Ajouter: GROQ_API_KEY = votre_clé_groq
#
# 📊 Quota Management:
# - Default: 1500 LLM calls/day (free tier)
# - 2 sites = 750 calls per site
# - Cached jobs don't count against quota
# - Early stopping when quota exhausted
#
# 🌐 Active Sites:
# - jemepropose.com
# - allovoisins.com
#
# To add more sites, update the --sites argument:
# python scheduled_scraper_v3.py --sites jemepropose allovoisins malt comet
# 3. Settings → Actions → General → Workflow permissions
#    → Cocher "Read and write permissions"
