# GitHub Actions - Run scraper dans le cloud
# PC peut être éteint, GitHub exécute le code automatiquement
#
# Features:
# - Multi-site scraping of neighborhood help / small-mission platforms
# - Intelligent quota management (1500 LLM calls/day max)
# - Incremental scraping (only analyze NEW jobs)
# - Automatic quota redistribution between sites
#
# Active Sites (neighborhood help / small missions only):
# - jemepropose.com  (French freelance missions, employers only, offer_type=2)
# - allovoisins.com  (French local services, all France, zone=0)
# - ringtwice.be     (Belgian neighborhood help / small missions)

name: Daily Job Scraper

on:
  schedule:
    - cron: '0 6 * * *'  # Run once daily (UTC)
  workflow_dispatch:

concurrency:
  group: daily-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Restore cache folder
        uses: actions/cache@v4
        with:
          path: cache/
          key: job-cache-v1
          restore-keys: |
            job-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run multi-site scraper with intelligent quota
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_DAILY_TOKEN_BUDGET: '300000'
          GROQ_EST_TOKENS_PER_CALL: '900'
          HISTORY_RETENTION_DAYS: '90'
        run: |
          python scheduled_scraper_v3.py --sites jemepropose allovoisins ringtwice --verbose

      - name: Commit and push results
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add exports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update: $(date +'%Y-%m-%d %H:%M')" && git push)

# ⚙️ Configuration requise :
# 1. GitHub → Settings → Secrets and variables → Actions
# 2. Ajouter: GROQ_API_KEY = votre_clé_groq
#
# 📊 Quota Management:
# - Default: 1500 LLM calls/day (free tier)
# - LLM quota split equally among all sites
# - Incremental cache avoids re-analyzing jobs seen in last 24h
# - LLM content-hash cache avoids re-calling API for same job content (permanent)
# - Both caches cleaned periodically (history: 30d, LLM files: 60d)
#
# 🌐 Active Sites (neighborhood help / small missions):
# - jemepropose.com  (French local services marketplace)
# - allovoisins.com  (French neighborhood help, all regions)
# - ringtwice.be     (Belgian neighborhood help / small missions)
#
# To add a site, add it to --sites (choices: jemepropose allovoisins ringtwice)
# 3. Settings → Actions → General → Workflow permissions
#    → Cocher "Read and write permissions"
