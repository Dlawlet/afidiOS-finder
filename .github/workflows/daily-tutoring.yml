# GitHub Actions - Daily tutoring scraper (separate from general pipeline)
#
# Runs 3h after the general scraper to avoid Groq rate-limit collision
# (both pipelines share the same API key, 1500 calls/day free tier).
#
# Scrapes student tutoring requests from:
#   - voscours.fr          (France/EU student ads, dedicated tutoring platform)
#   - findtutors.co.uk     (UK student ads, dedicated tutoring platform)
#   - jemepropose.com      (filtered via TutoringPreFilter — ~5% signal)
#   - allovoisins.com      (filtered via TutoringPreFilter — ~5% signal)
#
# Output lands in the SAME exports/jobs_latest.json/csv as the general pipeline,
# tagged with vertical='tutoring'. No separate tutoring-specific export files.

name: Daily Tutoring Scraper

on:
  schedule:
    - cron: '0 9 * * *'   # Run once daily (UTC); 3h after general scraper
  workflow_dispatch:        # Allow manual trigger for testing

concurrency:
  group: daily-tutoring
  cancel-in-progress: false

jobs:
  scrape-tutoring:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Pull latest (general scraper may have pushed exports/ earlier today)
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Restore LLM cache
        uses: actions/cache@v4
        with:
          path: cache/
          key: job-cache-v1
          restore-keys: |
            job-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tutoring scraper
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TUTORING_LLM_QUOTA: '500'
          HISTORY_RETENTION_DAYS: '90'
        run: |
          python tutoring_scraper.py \
            --sites voscours findtutors_uk jemepropose allovoisins \
            --verbose

      - name: Commit and push results
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add exports/
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "🤖 Auto-update: $(date +'%Y-%m-%d %H:%M')" && git push)

# ⚙️ Configuration requise :
# 1. GitHub → Settings → Secrets and variables → Actions
#    GROQ_API_KEY must already be set (shared with daily-scrape.yml)
# 2. Settings → Actions → General → Workflow permissions
#    → "Read and write permissions" must be enabled
#
# 📊 Quota:
# - Tutoring pipeline budget: 500 LLM calls (TUTORING_LLM_QUOTA in tutoring_scraper.py)
# - Dedicated sites (voscours, findtutors_uk): every card goes to LLM
# - General sites (jemepropose, allovoisins): TutoringPreFilter drops ~95% before LLM
# - Incremental + content-hash cache prevents re-analysis of unchanged posts
#
# 🎓 Output files:
# - exports/jobs_latest.json/csv  (merged general + tutoring, filter by vertical='tutoring')
